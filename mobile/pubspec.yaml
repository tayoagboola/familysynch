name: familysynch
description: FamilySync — Shared Family Command Center
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.1

  # Backend / Auth
  supabase_flutter: ^2.5.3
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2

  # Calendar UI
  table_calendar: ^3.1.2

  # Fonts
  google_fonts: ^6.2.1

  # UI & Animations
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  confetti: ^0.7.0

  # Utilities
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  app_links: ^6.3.2
  flutter_dotenv: ^5.1.0
  uuid: ^4.4.2
  intl: ^0.19.0

  # Local Storage
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # Push Notifications
  firebase_core: ^3.4.1
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2

  # Monetization
  purchases_flutter: ^9.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - .env
